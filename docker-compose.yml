services:
  miloagent:
    build: .
    container_name: miloagent
    restart: unless-stopped
    ports:
      # Bind address is configurable so you don't have to hand-edit this file.
      # Default 127.0.0.1 = dashboard reachable only from the host (safest).
      # Set MILO_BIND=0.0.0.0 in .env when access is fronted by Tailscale or a
      # reverse proxy (e.g. Raspberry Pi at home reached over a Tailnet).
      - "${MILO_BIND:-127.0.0.1}:${MILO_PORT:-8420}:8420"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./projects:/app/projects
      - ./prompts:/app/prompts
      - ./logs:/app/logs
    environment:
      - MILO_WEB_USER=${MILO_WEB_USER:-admin}
      - MILO_WEB_PASS=${MILO_WEB_PASS}
      - MILO_WEB_TOKEN=${MILO_WEB_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # GEO tracking (Nova 1.2) API keys — optional, only if config/geo.yaml is enabled
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TZ=${TZ:-UTC}
    deploy:
      resources:
        limits:
          memory: ${MILO_MEM_LIMIT:-512m}
          cpus: "${MILO_CPU_LIMIT:-1.0}"
        reservations:
          memory: 128m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8420/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
